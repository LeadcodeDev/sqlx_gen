name: Publish to crates.io

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply tag version to workspace
        run: |
          # The tag is the single source of truth for a release: the manifest is
          # rewritten from it here rather than bumped by hand beforehand, so a
          # release can no longer fail on a tag/manifest mismatch.
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "Releasing $TAG_VERSION"

          # Version is centralized in [workspace.package]; both crates inherit it
          # via `version.workspace = true`. Written as `sed > tmp && mv` rather
          # than `sed -i`, whose syntax differs between GNU and BSD — this form
          # is the one exercised by the local test.
          sed -E '/^\[workspace\.package\]/,/^\[workspace\.dependencies\]/ s/^version = "[^"]*"/version = "'"$TAG_VERSION"'"/' \
            Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml

          # The internal pin must move in lockstep: sqlx-gen depends on
          # sqlx-gen-macros by version, and both crates are always released
          # together. Leaving it behind would publish a sqlx-gen requiring a
          # macros version that never shipped.
          sed -E 's|^(sqlx-gen-macros = \{ path = "crates/sqlx_gen_macros", version = )"[^"]*"|\1"'"$TAG_VERSION"'"|' \
            Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml

          cargo update --workspace

      - name: Verify the version was applied
        run: |
          # Neither sed fails loudly if its pattern stops matching, so assert on
          # the resolved metadata: without this, a drifted manifest layout would
          # silently republish the previous version.
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          for pkg in sqlx-gen sqlx-gen-macros; do
            GOT=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg p "$pkg" '.packages[] | select(.name==$p) | .version')
            echo "$pkg: $GOT"
            if [ "$GOT" != "$TAG_VERSION" ]; then
              echo "::error::$pkg is at $GOT, expected $TAG_VERSION"
              exit 1
            fi
          done

      # --allow-dirty: the version above is applied in the runner and never
      # committed, so the working tree is intentionally dirty at this point.
      - name: Publish sqlx-gen-macros
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package sqlx-gen-macros

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish sqlx-gen
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package sqlx-gen
